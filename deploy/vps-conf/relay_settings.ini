; PVP tier. Contract verified in KSO3GameCenterSettings::LoadRelaySettings()
; (SO3GameCenterD @ 0x8108250): [ZoneServer] takes IP/Port/PingCycle only, and the
; arena/battlefield module names live in [ModuleConnect], NOT in [ZoneServer].
; Reconnect backoff is [GameCenter] ReconnectInterval in RemoteCenterConstList.ini.
[ZoneServer]
IP=127.0.0.1
Port=9111
PingCycle=40

; Must match arena_server.ini / battlefield_server.ini [Global] Name, which is the
; name each module binds under at the Zone hub ("[ModuleN] '%s' bind!").
[ModuleConnect]
ArenaServerName=arena0
BattlefieldServerName=bf0
