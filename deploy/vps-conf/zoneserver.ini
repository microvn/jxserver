; KIniFile does NOT trim whitespace around '=' — "Port = 9111" silently yields the
; compiled-in default (KZoneSettings::Init reads [Zone]Port with default 0x2396=9110).
; The ini shipped in the 2012 package has spaces and was therefore already broken.
; Keys read by KZoneSettings::Init: IP, Port, Timeout, WorkThreadNum.
[Zone]
line=jx3vn
IP=127.0.0.1
Port=9111
Timeout=60
WorkThreadNum=4
